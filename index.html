<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rillant's Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Search */
        .search-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        /* Series Grid */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .series-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .series-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .series-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .series-name {
            font-size: 1.2em;
            font-weight: bold;
            word-break: break-word;
            line-height: 1.4;
        }

        .series-volume-count {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
            color: #999;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2em;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            opacity: 0.8;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.3em;
            word-break: break-word;
            padding-right: 20px;
        }

        .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(80vh - 80px);
        }

        .modal-volume-list {
            list-style: none;
        }

        .modal-volume-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-volume-item:last-child {
            border-bottom: none;
        }

        .modal-volume-name {
            font-size: 1em;
            color: #333;
        }

        .modal-volume-size {
            font-size: 0.85em;
            color: #999;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .series-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-card {
                flex: 1;
            }
            
            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Rillant's Digital Manga Collection</h1>
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalSeries">-</div>
                    <div class="stat-label">Series</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalVolumes">-</div>
                    <div class="stat-label">Volumes</div>
                </div>
                <!--
                <div class="stat-card">
                    <div class="stat-number" id="totalSize">-</div>
                    <div class="stat-label">Total Size (GB)</div>
                </div>
                -->
            </div>
        </div>

        <div class="search-section">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search series by name...">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All Series</button>
                <button class="filter-btn" data-filter="small">Small (&lt; 5 vols)</button>
                <button class="filter-btn" data-filter="medium">Medium (5-20 vols)</button>
                <button class="filter-btn" data-filter="large">Large (&gt; 20 vols)</button>
            </div>
        </div>

        <div class="series-grid" id="seriesGrid">
            <div class="loading">Loading collection data...</div>
        </div>

        <div class="footer">
            Database generated on June 6th, 2026.
        </div>
    </div>

    <!-- Modal -->
    <div id="volumeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Series Name</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <ul class="modal-volume-list" id="modalVolumeList"></ul>
            </div>
        </div>
    </div>

    <script>
        let mangaData = null;
        let currentFilter = 'all';
        
        // Modal elements
        const modal = document.getElementById('volumeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalVolumeList = document.getElementById('modalVolumeList');
        const closeBtn = document.querySelector('.close');
        
        // Close modal when clicking X or outside
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }
        
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // Load the JSON data
        async function loadData() {
            try {
                const response = await fetch('manga_collection.json');
                if (!response.ok) throw new Error('Failed to load data');
                mangaData = await response.json();
                updateStats();
                renderSeries();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('seriesGrid').innerHTML = 
                    '<div class="no-results">❌ Failed to load manga collection data. Please ensure manga_collection.json exists.</div>';
            }
        }
        
        // Update statistics
        function updateStats() {
            document.getElementById('totalSeries').textContent = mangaData.total_series;
            document.getElementById('totalVolumes').textContent = mangaData.total_volumes;
            
            // Calculate total size
            let totalSizeGB = 0;
            mangaData.series.forEach(series => {
                series.volumes.forEach(volume => {
                    totalSizeGB += volume.size_mb || 0;
                });
            });
            totalSizeGB = totalSizeGB / 1024;
            // document.getElementById('totalSize').textContent = totalSizeGB.toFixed(2);
        }
        
        // Filter series based on search and volume count
        function filterSeries(series) {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            // Search filter
            if (searchTerm && !series.name.toLowerCase().includes(searchTerm)) {
                return false;
            }
            
            // Volume count filter
            if (currentFilter === 'small' && series.volume_count >= 5) return false;
            if (currentFilter === 'medium' && (series.volume_count < 5 || series.volume_count > 20)) return false;
            if (currentFilter === 'large' && series.volume_count <= 20) return false;
            
            return true;
        }
        
        // Show modal with volumes
        function showVolumes(series) {
            modalTitle.textContent = series.name;
            modalVolumeList.innerHTML = '';
            
            series.volumes.forEach(volume => {
                const li = document.createElement('li');
                li.className = 'modal-volume-item';
                li.innerHTML = `
                    <span class="modal-volume-name">${escapeHtml(volume.name)}</span>
                    <span class="modal-volume-size">${volume.size_mb ? volume.size_mb.toFixed(2) : '?'} MB</span>
                `;
                modalVolumeList.appendChild(li);
            });
            
            modal.style.display = 'block';
        }
        
        // Render series grid
        function renderSeries() {
            const filteredSeries = mangaData.series.filter(filterSeries);
            const grid = document.getElementById('seriesGrid');
            
            if (filteredSeries.length === 0) {
                grid.innerHTML = '<div class="no-results">🔍 No series found matching your criteria</div>';
                return;
            }
            
            grid.innerHTML = filteredSeries.map(series => `
                <div class="series-card" data-series-name="${escapeHtml(series.name)}">
                    <div class="series-header">
                        <div class="series-name">${escapeHtml(series.name)}</div>
                        <div class="series-volume-count">📖 ${series.volume_count} volumes</div>
                    </div>
                </div>
            `).join('');
            
            // Add click handlers for series cards
            document.querySelectorAll('.series-card').forEach((card, index) => {
                card.addEventListener('click', () => {
                    const seriesName = card.getAttribute('data-series-name');
                    const series = filteredSeries.find(s => s.name === seriesName);
                    if (series) {
                        showVolumes(series);
                    }
                });
            });
        }
        
        // Simple escape function to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Event listeners
        document.getElementById('searchInput').addEventListener('input', () => {
            renderSeries();
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSeries();
            });
        });
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
